apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: car-sales-api:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: api-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DATABASE_URL
        readinessProbe:
          httpGet:
            path: /sales
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10