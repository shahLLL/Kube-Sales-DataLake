apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-setup
spec:
  template:
    spec:
      containers:
      - name: mc
        image: minio/mc:latest
        env:
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: S3_SECRET_KEY
        command:
        - /bin/sh
        - -c
        - |
          # Use the keys exactly as defined in the secret
          until mc alias set myminio http://minio-service:9000 $S3_ACCESS_KEY $S3_SECRET_KEY; do
            echo "Waiting for MinIO..."
            sleep 2
          done
          mc mb myminio/sales-data-lake || true
          echo "Bucket 'sales-data-lake' created successfully."
      restartPolicy: OnFailure