apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-setup
spec:
  template:
    spec:
      containers:
      - name: mc
        image: minio/mc:latest
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-creds
              key: root-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-creds
              key: root-password
        command:
        - /bin/sh
        - -c
        - |
          # Wait for the service to be reachable
          until mc alias set myminio http://minio-service:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD; do
            echo "Waiting for MinIO..."
            sleep 2
          done
          # Create bucket if it doesn't exist
          mc mb myminio/sales-data-lake || true
          echo "Bucket setup complete."
      restartPolicy: OnFailure