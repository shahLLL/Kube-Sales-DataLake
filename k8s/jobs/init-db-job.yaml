apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-schema
spec:
  template:
    spec:
      containers:
      - name: psql-client
        image: postgres:15-alpine
        env:
          - name: PGPASSWORD
            value: "password123" # Must match your postgres-config password
        command: 
          - /bin/sh
          - -c
          - |
            # We use the internal service name to reach the StatefulSet
            psql -h postgres-service -U admin_user -d sales_db -f /scripts/schema.sql
        volumeMounts:
        - name: schema-vol
          mountPath: /scripts
      restartPolicy: OnFailure
      volumes:
      - name: schema-vol
        configMap:
          name: db-schema-config
  backoffLimit: 4